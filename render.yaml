# Render Blueprint for the API and its database: in the Render dashboard,
# New > Blueprint, then pick this repository. Every `sync: false` value is asked
# for there and never stored in git. README.md, "Deploying to Render", explains
# each one.
services:
  - type: web
    name: whowins-api
    runtime: docker
    plan: free
    # The closest region to Latin America; the database must be in the same one
    # for the private connection to work.
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Only commits whose GitHub checks passed get deployed.
    autoDeployTrigger: checksPass
    envVars:
      - key: ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: whowins-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: whowins-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: whowins-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: whowins-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: whowins-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # The frontend's address, e.g. https://whowins.onrender.com. The last two
      # take the same value because the browser reaches the API through it.
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OAUTH_REDIRECT_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        sync: false

databases:
  - name: whowins-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: whowins
    user: whowins
    # Reachable only from Render's private network, never from the internet.
    ipAllowList: []
